<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="薬剤師の在宅訪問のイラスト">
  <!-- house -->
  <g transform="translate(46 46)">
    <path d="M-14 92L134 -6l148 98z" fill="#edf2f5" stroke="#3d4e5e" stroke-width="2.6" stroke-linejoin="round"/>
    <rect x="18" y="92" width="232" height="132" rx="5" fill="#ffffff" stroke="#3d4e5e" stroke-width="2.6"/>
    <path d="M18 92h232" stroke="#3d4e5e" stroke-width="2.6"/>
    <!-- window -->
    <rect x="44" y="120" width="70" height="58" rx="4" fill="#d4dfe7" stroke="#3d4e5e" stroke-width="2.2"/>
    <path d="M79 120v58M44 149h70" stroke="#3d4e5e" stroke-width="1.8" stroke-opacity=".55"/>
    <!-- door -->
    <rect x="160" y="140" width="62" height="84" rx="4" fill="#f6f8f4" stroke="#3d4e5e" stroke-width="2.2"/>
    <circle cx="172" cy="184" r="4" fill="#3d4e5e"/>
    <!-- chimney -->
    <rect x="214" y="12" width="26" height="46" rx="3" fill="#ffffff" stroke="#3d4e5e" stroke-width="2.4"/>
  </g>

  <!-- pharmacist bag -->
  <g transform="translate(346 168)">
    <rect x="0" y="22" width="132" height="92" rx="9" fill="#ffffff" stroke="#3d4e5e" stroke-width="2.6"/>
    <path d="M44 22v-12a22 22 0 0 1 44 0v12" fill="none" stroke="#3d4e5e" stroke-width="2.6"/>
    <rect x="0" y="48" width="132" height="14" fill="#8fa83d" fill-opacity=".22"/>
    <path d="M66 46v44M44 68h44" stroke="#8fa83d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- medication calendar -->
  <g transform="translate(336 40)">
    <rect x="0" y="0" width="156" height="106" rx="6" fill="#ffffff" stroke="#3d4e5e" stroke-width="2.4"/>
    <rect x="0" y="0" width="156" height="16" rx="6" fill="#5b8cb0"/>
    <rect x="0" y="10" width="156" height="6" fill="#5b8cb0"/>
    <g stroke="#b8c8d4" stroke-width="1.6">
      <path d="M52 16v90M104 16v90M0 52h156M0 79h156"/>
    </g>
    <g fill="#8fa83d" fill-opacity=".55">
      <circle cx="26" cy="34" r="7"/>
      <circle cx="78" cy="34" r="7"/>
      <circle cx="26" cy="66" r="7"/>
    </g>
    <g fill="#d98f40" fill-opacity=".6">
      <circle cx="130" cy="34" r="7"/>
      <circle cx="78" cy="93" r="7"/>
    </g>
  </g>

  <!-- walking route -->
  <g fill="none" stroke="#d98f40" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 12">
    <path d="M330 268c-40 10-86 8-124-6"/>
  </g>
</svg>
